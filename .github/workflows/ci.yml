name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: requirements*.txt
      - run: pip install -r requirements-dev.txt
      - run: python -m pytest -q

  compose-smoke:
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v4
      - name: Build and start the stack
        run: docker compose up -d --build
      - name: Wait for the API
        run: |
          for i in $(seq 1 60); do
            if curl -fsS http://localhost:8000/health; then echo; exit 0; fi
            sleep 3
          done
          docker compose logs
          exit 1
      - name: Check seeded data over PostGIS
        run: |
          curl -fsS http://localhost:8000/api/v1/sites | python3 -c "
          import json, sys
          d = json.load(sys.stdin)
          print('sites:', d['total'])
          assert d['total'] >= 24, d['total']"
          curl -fsS "http://localhost:8000/api/v1/sites/nearby?lat=23.2&lng=72.6&radius_km=60" > /dev/null
          curl -fsS http://localhost:8000/api/v1/meta > /dev/null
      - name: Logs on failure
        if: failure()
        run: docker compose logs --no-color
      - name: Tear down
        if: always()
        run: docker compose down -v
